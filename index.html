<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ForkitChat Frontend Demo</title>
    <meta
      name="description"
      content="A static GitHub Pages ready prototype for ForkitChat's keyword tree discovery feed."
    />
    <style>
:root {
  color-scheme: dark;
  --bg: #050607;
  --panel: #0b0c0e;
  --panel-2: #17181b;
  --line: #202226;
  --text: #eceef0;
  --muted: #888b94;
  --soft: #b7bac2;
  --green: #12c998;
  --green-2: #079a74;
  --red: #12c998;
  --yellow: #8fd6c7;
  --blue: #2fc7ac;
  --violet: #6d63d9;
  --shadow: 0 18px 44px rgba(0, 0, 0, 0.42);
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  background:
    radial-gradient(circle at 78% 4%, rgba(18, 201, 152, 0.13), transparent 28rem),
    radial-gradient(circle at 50% 96%, rgba(18, 201, 152, 0.2), transparent 33rem),
    radial-gradient(circle at 24% 88%, rgba(18, 201, 152, 0.14), transparent 28rem),
    radial-gradient(circle at 74% 28%, rgba(255, 255, 255, 0.035), transparent 24rem),
    linear-gradient(rgba(255, 255, 255, 0.032) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255, 255, 255, 0.032) 1px, transparent 1px),
    linear-gradient(180deg, #050607 0%, #07080a 100%);
  background-size:
    auto,
    auto,
    auto,
    auto,
    4.5rem 4.5rem,
    4.5rem 4.5rem,
    auto;
  color: var(--text);
  font-family:
    Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
    "PingFang SC", "Microsoft YaHei", sans-serif;
}

button,
input,
select {
  font: inherit;
}

button,
select {
  cursor: pointer;
}

.app-shell {
  display: grid;
  grid-template-columns: 12.75rem minmax(0, 1fr);
  min-height: 100vh;
}

.sidebar {
  position: sticky;
  top: 0;
  height: 100vh;
  padding: 1.5rem 0.8rem;
  border-right: 1px solid var(--line);
  background: rgba(5, 6, 7, 0.9);
}

.brand {
  display: inline-flex;
  align-items: center;
  gap: 0;
  color: var(--text);
  text-decoration: none;
  font-size: 2rem;
  font-weight: 800;
  letter-spacing: 0;
}

.brand-mark {
  position: relative;
  display: inline-block;
  color: var(--green);
  font-family: Georgia, "Times New Roman", serif;
  font-size: 2.55rem;
  font-weight: 900;
  line-height: 0.8;
  transform: skewX(-8deg);
}

.brand-mark::before {
  content: "";
  position: absolute;
  left: -0.18rem;
  top: 0.18rem;
  width: 0.12rem;
  height: 0.78rem;
  border-radius: 999px;
  background: var(--green);
  transform: rotate(-16deg);
}

.brand-mark::after {
  content: "";
  position: absolute;
  left: 0.36rem;
  top: 0.27rem;
  width: 0.84rem;
  height: 0.24rem;
  border-radius: 999px 999px 999px 0;
  background: var(--green);
  transform: rotate(-18deg);
}

.brand-rest {
  margin-left: -0.08rem;
  color: var(--text);
  font-size: 2rem;
  font-weight: 800;
  line-height: 1;
}

.side-nav {
  display: grid;
  gap: 0.3rem;
  margin-top: 2.1rem;
}

.side-link,
.plain-button,
.ghost-button {
  display: flex;
  align-items: center;
  gap: 0.75rem;
  min-height: 2.65rem;
  color: var(--soft);
  text-decoration: none;
  border: 0;
  border-radius: 8px;
  background: transparent;
  padding: 0 0.6rem;
  font-weight: 700;
}

.side-link.active,
.side-link:hover,
.plain-button:hover,
.ghost-button:hover {
  background: #121315;
  color: var(--text);
}

.login-button,
.primary-button {
  min-height: 2.9rem;
  border: 0;
  border-radius: 8px;
  padding: 0 1.35rem;
  background: linear-gradient(135deg, #2cae9f 0%, #239982 50%, #7664d8 100%) !important;
  color: #f6f7fb;
  font-weight: 800;
  box-shadow:
    0 12px 30px rgba(18, 201, 152, 0.13),
    0 8px 24px rgba(113, 91, 232, 0.12);
}

.login-button {
  width: 100%;
  margin-top: 1.9rem;
}

.sidebar-foot {
  position: absolute;
  left: 1rem;
  right: 1rem;
  bottom: 1.8rem;
  display: grid;
  gap: 0.45rem;
}

.main {
  min-width: 0;
}

.topbar {
  position: sticky;
  top: 0;
  z-index: 10;
  display: grid;
  grid-template-columns: minmax(16rem, 38rem) auto;
  justify-content: center;
  align-items: center;
  gap: 1.5rem;
  min-height: 5.25rem;
  padding: 0.9rem 1.5rem;
  border-bottom: 1px solid var(--line);
  background: rgba(5, 6, 7, 0.86);
  backdrop-filter: blur(18px);
}

.search-wrap {
  display: flex;
  align-items: center;
  gap: 0.75rem;
  height: 2.75rem;
  border: 1px solid #292b30;
  border-radius: 8px;
  background: #17181b;
  padding: 0 1rem;
  color: var(--muted);
}

.search-wrap input {
  width: 100%;
  min-width: 0;
  border: 0;
  outline: 0;
  background: transparent;
  color: var(--text);
  font-size: 1rem;
}

.top-actions {
  display: flex;
  align-items: center;
  gap: 0.7rem;
}

.intro-strip {
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(18rem, 34rem);
  gap: 2rem;
  align-items: end;
  padding: 2rem 2rem 1.2rem;
}

.eyebrow {
  margin: 0 0 0.45rem;
  color: var(--green);
  font-size: 0.78rem;
  font-weight: 800;
  letter-spacing: 0;
  text-transform: uppercase;
}

h1,
h2,
p {
  margin-top: 0;
}

h1 {
  margin-bottom: 0;
  font-size: clamp(2rem, 4.4vw, 4.8rem);
  line-height: 1.02;
  letter-spacing: 0;
}

.intro-strip p:last-child,
.feed-head p,
.detail-panel p {
  color: var(--muted);
  line-height: 1.75;
}

.content-layout {
  display: block;
  max-width: 76rem;
  margin: 0 auto;
  padding: 1rem 2rem 3rem;
}

.feed-head {
  display: flex;
  justify-content: space-between;
  align-items: end;
  gap: 1rem;
  margin-bottom: 1rem;
}

.feed-head h2,
.detail-panel h2 {
  margin-bottom: 0.3rem;
  font-size: 1.35rem;
}

select {
  min-height: 2.55rem;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: #17181b;
  color: var(--soft);
  padding: 0 0.85rem;
}

.bubble-field {
  display: grid;
  grid-template-columns: repeat(2, minmax(22rem, 32rem));
  justify-content: center;
  align-items: flex-start;
  gap: 3.2rem 4rem;
  padding: 0.5rem 0 3rem;
}

.tree-card {
  position: relative;
  display: block;
  width: 100%;
  margin: 0;
  overflow: hidden;
  border: 1px solid var(--line);
  border-radius: 18px;
  background:
    radial-gradient(circle at 50% 100%, rgba(18, 201, 152, 0.08), transparent 13rem),
    var(--panel);
  box-shadow: var(--shadow);
  cursor: pointer;
  transform-origin: center;
  vertical-align: top;
  transition:
    transform 820ms cubic-bezier(0.18, 1.2, 0.22, 1),
    border-radius 820ms cubic-bezier(0.18, 1.2, 0.22, 1),
    border-color 320ms ease,
    box-shadow 620ms ease,
    filter 620ms ease,
    opacity 620ms ease;
}

.tree-card:focus-visible,
.tree-card.is-previewing,
.tree-card.is-expanded {
  border-color: rgba(18, 201, 152, 0.58);
}

.tree-card.is-expanded {
  z-index: 3;
  width: 100%;
  margin-left: 0;
  transform: translateY(-0.35rem) scale(1.012);
  border-radius: 18px;
  border-color: rgba(18, 201, 152, 0.68);
  box-shadow:
    0 26px 64px rgba(0, 0, 0, 0.46),
    0 0 0 1px rgba(18, 201, 152, 0.22);
}

.tree-card.is-lifting {
  animation: card-lift-bloom 760ms cubic-bezier(0.16, 0.82, 0.18, 1);
}

.tree-cover {
  position: relative;
  height: 16rem;
  overflow: hidden;
  border-bottom: 1px solid var(--line);
  background:
    radial-gradient(circle at 48% 88%, rgba(18, 201, 152, 0.12), transparent 18rem),
    linear-gradient(rgba(255, 255, 255, 0.035) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255, 255, 255, 0.035) 1px, transparent 1px),
    linear-gradient(180deg, #111214, #07110f);
  background-size:
    auto,
    2.1rem 2.1rem,
    2.1rem 2.1rem,
    auto;
  transition: height 820ms cubic-bezier(0.18, 1.2, 0.22, 1);
}

.tree-cover::before,
.tree-cover::after {
  content: "";
  position: absolute;
  z-index: 2;
  pointer-events: none;
}

.tree-cover::before {
  inset: 0;
  background:
    linear-gradient(90deg, rgba(13, 15, 17, 0.35), transparent 18%, transparent 82%, rgba(13, 15, 17, 0.35)),
    linear-gradient(180deg, rgba(5, 6, 7, 0.18), transparent 24%, transparent 78%, rgba(5, 6, 7, 0.68));
}

.tree-cover::after {
  inset: auto 0 0;
  height: 5.2rem;
  background: linear-gradient(180deg, transparent, rgba(13, 15, 17, 0.88));
}

.tree-map {
  position: absolute;
  left: 50%;
  top: 50%;
  width: 100%;
  height: 100%;
  pointer-events: none;
  transform: translate(-50%, -50%);
  transition:
    width 820ms cubic-bezier(0.18, 1.2, 0.22, 1),
    height 820ms cubic-bezier(0.18, 1.2, 0.22, 1),
    transform 520ms ease-out;
}

.tree-map svg {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
}

.tree-line {
  fill: none;
  stroke: rgba(199, 204, 210, 0.21);
  stroke-linecap: round;
  stroke-width: 4.4;
}

.tree-line.active {
  stroke: var(--green);
  stroke-width: 6;
  filter: drop-shadow(0 0 11px rgba(18, 201, 152, 0.42));
}

.hidden-node-in-preview {
  opacity: 0;
  pointer-events: none;
}

.trail-line-in-preview {
  opacity: 1;
  stroke: rgba(199, 204, 210, 0.21);
  stroke-dasharray: none;
  filter: none;
}

.keyword-node {
  position: absolute;
  z-index: 4;
  transform: translate(-50%, -50%);
  max-width: 7.2rem;
  border: 1.4px solid rgba(18, 201, 152, 0.5);
  border-radius: 8px;
  background: rgba(12, 14, 15, 0.92);
  color: #d7dce3;
  padding: 0.4rem 0.54rem;
  font-size: 0.78rem;
  font-weight: 850;
  line-height: 1.28;
  transition:
    transform 360ms cubic-bezier(0.2, 0.9, 0.2, 1),
    color 260ms ease,
    border-color 260ms ease,
    background 260ms ease,
    max-width 260ms ease,
    padding 260ms ease,
    box-shadow 260ms ease,
    opacity 360ms ease,
    font-size 260ms ease;
  pointer-events: auto;
}

.node-detail {
  display: none;
  max-width: 8.4rem;
  overflow-wrap: anywhere;
  white-space: normal;
  vertical-align: bottom;
}

.tree-card.is-previewing .hidden-node-in-preview,
.tree-card.is-expanded .hidden-node-in-preview {
  opacity: 1;
  pointer-events: auto;
}

.tree-card.is-previewing .trail-line-in-preview,
.tree-card.is-expanded .trail-line-in-preview {
  opacity: 1;
  stroke: rgba(199, 204, 210, 0.21);
  stroke-dasharray: none;
  filter: none;
}

.tree-card.is-previewing .trail-line-in-preview.active,
.tree-card.is-expanded .trail-line-in-preview.active {
  stroke: var(--green);
  stroke-width: 6;
  filter: drop-shadow(0 0 11px rgba(18, 201, 152, 0.42));
}

.keyword-node.active {
  transform: translate(-50%, -50%) scale(1.03);
  border-color: var(--green);
  background: rgba(18, 201, 152, 0.16);
  color: white;
}

.flow-cursor {
  position: absolute;
  z-index: 4;
  width: 1.15rem;
  height: 1.15rem;
  border: 2px solid var(--green);
  border-left-color: transparent;
  border-bottom-color: transparent;
  transform: translate(-50%, -50%) rotate(45deg);
  filter: drop-shadow(0 0 12px rgba(18, 201, 152, 0.7));
  transition:
    left 190ms ease,
    top 190ms ease;
  pointer-events: none;
}

.card-body {
  padding: 0.7rem 0.78rem 0.82rem;
  transition: padding 820ms cubic-bezier(0.18, 1.2, 0.22, 1);
}

.title-row {
  display: flex;
  gap: 0.5rem;
  align-items: flex-start;
}

.lock {
  color: var(--muted);
  line-height: 1.45;
}

.card-title {
  margin: 0;
  font-size: 0.98rem;
  line-height: 1.45;
  transition: font-size 820ms cubic-bezier(0.18, 1.2, 0.22, 1);
}

.card-summary {
  max-height: 0;
  margin: 0;
  overflow: hidden;
  color: var(--muted);
  opacity: 0;
  font-size: 0.72rem;
  line-height: 1.58;
  transition:
    max-height 820ms cubic-bezier(0.18, 1.2, 0.22, 1),
    margin 820ms cubic-bezier(0.18, 1.2, 0.22, 1),
    opacity 420ms ease,
    font-size 820ms cubic-bezier(0.18, 1.2, 0.22, 1);
}

.meta {
  display: flex;
  justify-content: space-between;
  gap: 0.7rem;
  margin-top: 0.8rem;
  color: var(--muted);
  font-size: 0.67rem;
  transition: font-size 820ms cubic-bezier(0.18, 1.2, 0.22, 1);
}

.author {
  display: inline-flex;
  align-items: center;
  gap: 0.42rem;
  min-width: 0;
}

.avatar {
  display: inline-grid;
  place-items: center;
  width: 1.3rem;
  height: 1.3rem;
  flex: 0 0 auto;
  border-radius: 6px;
  background: var(--avatar);
  color: #06110e;
  font-size: 0.68rem;
  font-weight: 900;
}

.stats {
  flex: 0 0 auto;
}

.tags {
  display: flex;
  flex-wrap: wrap;
  gap: 0.4rem;
  margin-top: 0.75rem;
}

.tag {
  border: 1px solid #24272c;
  border-radius: 6px;
  color: #aeb2bb;
  padding: 0.22rem 0.45rem;
  font-size: 0.63rem;
  transition: font-size 820ms cubic-bezier(0.18, 1.2, 0.22, 1);
}

.tree-card.is-previewing .tree-cover {
  height: 13.2rem;
}

.tree-card.is-previewing .tree-map,
.tree-card.is-expanded .tree-map {
  width: 154%;
  height: 142%;
  transform: translate(
    calc(-50% + var(--tree-pan-x, 0%)),
    calc(-50% + var(--tree-pan-y, 0%))
  );
}

.tree-card.is-expanded .tree-map {
  opacity: 0.18;
  filter: blur(0.5px) brightness(0.72);
}

.tree-card.is-previewing .keyword-node,
.tree-card.is-expanded .keyword-node {
  max-width: 7.35rem;
  padding: 0.4rem 0.54rem;
  font-size: 0.86rem;
  line-height: 1.22;
}

.tree-card.is-previewing .node-detail,
.tree-card.is-expanded .node-detail {
  display: none;
}

.tree-card.is-previewing .node-short,
.tree-card.is-expanded .node-short {
  display: inline;
}

.tree-card.is-expanded .card-body {
  padding: 0.7rem 0.78rem 0.82rem;
}

.tree-card.is-expanded .card-title {
  font-size: 0.98rem;
}

.tree-card.is-expanded .card-summary {
  max-height: 0;
  margin-top: 0;
  opacity: 0;
  font-size: 0.72rem;
  line-height: 1.58;
}

.tree-node-content {
  position: absolute;
  left: 0.28rem;
  right: 0.28rem;
  top: 0.34rem;
  bottom: 0.34rem;
  z-index: 8;
  display: grid;
  align-content: center;
  max-height: none;
  overflow: hidden;
  clip-path: polygon(1% 53%, 8% 24%, 28% 8%, 61% 2%, 91% 10%, 100% 39%, 96% 70%, 73% 94%, 38% 99%, 8% 82%);
  border: 1px solid rgba(18, 201, 152, 0.3);
  border-radius: 62% 28% 66% 24% / 52% 26% 58% 28%;
  background:
    radial-gradient(ellipse at 28% 18%, rgba(255, 255, 255, 0.18), transparent 7rem),
    radial-gradient(ellipse at 82% 76%, rgba(18, 201, 152, 0.2), transparent 10rem),
    linear-gradient(132deg, rgba(22, 214, 160, 0.34), rgba(8, 37, 31, 0.96) 45%, rgba(9, 13, 18, 0.96) 82%);
  box-shadow:
    inset 0 0 0 1px rgba(18, 201, 152, 0.2),
    0 22px 54px rgba(0, 0, 0, 0.5),
    0 0 34px rgba(18, 201, 152, 0.12);
  opacity: 0;
  padding: 1.5rem 2.05rem 1.52rem;
  transform: translateY(0.35rem) scale(0.88) rotate(-1.5deg);
  transform-origin: var(--leaf-origin-x, 54%) var(--leaf-origin-y, 54%);
  transition:
    opacity 280ms ease,
    transform 360ms ease;
  pointer-events: none;
  perspective: 42rem;
  backface-visibility: hidden;
}

.tree-node-content::before {
  content: "";
  position: absolute;
  left: 8%;
  right: 10%;
  top: 50%;
  height: 1.5px;
  border: 0;
  background:
    linear-gradient(90deg, rgba(18, 201, 152, 0), rgba(129, 255, 219, 0.54), rgba(18, 201, 152, 0.08));
  transform: rotate(-18deg);
  transform-origin: 10% 50%;
  pointer-events: none;
}

.tree-node-content::after {
  content: "";
  position: absolute;
  inset: 17% 13% 18% 15%;
  background:
    linear-gradient(34deg, transparent 47%, rgba(129, 255, 219, 0.18) 48%, transparent 52%) 18% 28% / 34% 38% no-repeat,
    linear-gradient(-31deg, transparent 47%, rgba(129, 255, 219, 0.16) 48%, transparent 52%) 62% 24% / 34% 36% no-repeat,
    linear-gradient(37deg, transparent 47%, rgba(129, 255, 219, 0.14) 48%, transparent 52%) 30% 62% / 35% 34% no-repeat,
    linear-gradient(-35deg, transparent 47%, rgba(129, 255, 219, 0.13) 48%, transparent 52%) 64% 61% / 34% 32% no-repeat;
  pointer-events: none;
}

.tree-node-label {
  display: inline-flex;
  margin-bottom: 0.42rem;
  color: var(--green);
  font-size: 0.86rem;
  font-weight: 900;
}

.leaf-copy {
  position: relative;
  z-index: 1;
  display: grid;
  align-content: center;
  min-height: 100%;
  padding: 0.12rem 0.62rem;
}

.leaf-copy::after {
  content: "";
  position: absolute;
  left: -0.75rem;
  bottom: 8%;
  width: 2.6rem;
  height: 0.32rem;
  border-radius: 999px;
  background: linear-gradient(90deg, rgba(18, 201, 152, 0), rgba(18, 201, 152, 0.58));
  transform: rotate(-23deg);
  transform-origin: right center;
}

.tree-node-content p {
  margin: 0;
  color: #edf1f2;
  font-size: 0.96rem;
  font-weight: 760;
  line-height: 1.5;
  position: relative;
  z-index: 1;
}

.tree-node-label {
  position: relative;
  z-index: 1;
}

.tree-card.is-expanded .tree-node-content {
  opacity: 1;
  transform: translateY(0) scale(1) rotate(-1.5deg);
  pointer-events: auto;
}

.tree-card.is-expanded .tree-node-content.is-growing {
  animation: leaf-grow 760ms cubic-bezier(0.16, 0.82, 0.18, 1);
}

.tree-card.is-expanded .tree-node-content.is-flipping {
  animation: leaf-curl-away 540ms cubic-bezier(0.2, 0.78, 0.18, 1);
}

.leaf-arrow {
  position: absolute;
  z-index: 3;
  display: grid;
  place-items: center;
  width: 2rem;
  height: 2rem;
  border: 1px solid rgba(18, 201, 152, 0.34);
  border-radius: 999px;
  background:
    radial-gradient(circle at 35% 22%, rgba(255, 255, 255, 0.16), transparent 0.75rem),
    rgba(4, 10, 10, 0.72);
  color: #eff7f5;
  font-size: 1.2rem;
  font-weight: 900;
  line-height: 1;
  box-shadow:
    0 10px 24px rgba(0, 0, 0, 0.28),
    0 0 18px rgba(18, 201, 152, 0.14);
  transition:
    transform 180ms ease,
    border-color 180ms ease,
    background 180ms ease;
}

.leaf-arrow:hover {
  border-color: rgba(18, 201, 152, 0.62);
  background: rgba(11, 28, 25, 0.88);
  transform: scale(1.08);
}

.leaf-arrow:focus-visible {
  outline: 2px solid rgba(18, 201, 152, 0.78);
  outline-offset: 3px;
}

.leaf-arrow[hidden] {
  display: none;
}

.leaf-arrow-up {
  left: 50%;
  top: 0.42rem;
  transform: translateX(-50%);
}

.leaf-arrow-up:hover {
  transform: translateX(-50%) scale(1.08);
}

.leaf-arrow-right {
  right: 0.42rem;
  top: 50%;
  transform: translateY(-50%);
}

.leaf-arrow-right:hover {
  transform: translateY(-50%) scale(1.08);
}

.leaf-arrow-down {
  left: 50%;
  bottom: 0.42rem;
  transform: translateX(-50%);
}

.leaf-arrow-down:hover {
  transform: translateX(-50%) scale(1.08);
}

.leaf-arrow-left {
  left: 0.42rem;
  top: 50%;
  transform: translateY(-50%);
}

.leaf-arrow-left:hover {
  transform: translateY(-50%) scale(1.08);
}

@keyframes leaf-grow {
  0% {
    opacity: 0.12;
    border-radius: 999px;

const feed = document.querySelector("#feed");
const searchInput = document.querySelector("#searchInput");
const sortSelect = document.querySelector("#sortSelect");
const detailTitle = document.querySelector("#detailTitle");
const detailSummary = document.querySelector("#detailSummary");
const detailTurns = document.querySelector("#detailTurns");
const detailBranches = document.querySelector("#detailBranches");
const detailHeat = document.querySelector("#detailHeat");
const detailPath = document.querySelector("#detailPath");

const nodePositions = [
  [50, 14],
  [33, 37],
  [67, 37],
  [22, 64],
  [43, 66],
  [78, 64],
  [60, 80],
];

const edges = [
  [0, 1],
  [0, 2],
  [1, 3],
  [1, 4],
  [2, 5],
  [4, 6],
];

const previewSequence = [0, 1, 4, 6, 2, 5, 3];
let expandedCard = null;
let previewingCard = null;
let previewTimer = null;
let previewDelayTimer = null;

function escapeHtml(value) {
  return String(value)
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;");
}

function renderFeed() {
  stopPreview();
  stopPreviewDelay();
  expandedCard = null;
  previewingCard = null;
  const query = searchInput.value.trim().toLowerCase();
  const sortMode = sortSelect.value;
  let items = discussions.filter((item) => {
    const blob = [item.title, item.author, item.summary, item.tags.join(" "), item.keywords.join(" ")]
      .join(" ")
      .toLowerCase();
    return blob.includes(query);
  });

  items = items.sort((a, b) => {
    if (sortMode === "new") return b.time.localeCompare(a.time);
    if (sortMode === "deep") return b.turns + b.branches - (a.turns + a.branches);
    return b.heat - a.heat;
  });

  feed.innerHTML = items.length
    ? items.map((item, index) => renderCard(item, index)).join("")
    : '<div class="empty">没有找到对应的问题树。</div>';

  feed.querySelectorAll(".tree-card").forEach((card) => {
    const item = discussions.find((entry) => entry.id === card.dataset.id);
    wireCard(card, item);
  });
}

function renderCard(item, cardIndex = 0) {
  const nodes = item.keywords
    .map((keyword, index) => {
      const [left, top] = nodePositions[index] || nodePositions[nodePositions.length - 1];
      const nodeClasses = ["keyword-node", index > 5 ? "hidden-node-in-preview" : ""]
        .filter(Boolean)
        .join(" ");
      const expanded = nodeDetailsById[item.id]?.[index] || keyword;
      return `<span class="${nodeClasses}" data-node="${index}" style="left:${left}%; top:${top}%"><span class="node-short">${escapeHtml(keyword)}</span><span class="node-detail">${escapeHtml(expanded)}</span></span>`;
    })
    .join("");

  const lines = edges
    .map(([from, to], index) => {
      const a = nodePositions[from];
      const b = nodePositions[to];
      const lineClasses = ["tree-line", to > 5 ? "trail-line-in-preview" : ""]
        .filter(Boolean)
        .join(" ");
      const previewEndX = to > 5 ? Math.min(74, a[0] + 8) : b[0];
      const previewEndY = to > 5 ? 100 : b[1];
      const previewPath =
        to > 5
          ? `M ${a[0]} ${a[1]} C ${a[0] + 3} ${a[1] + 11}, ${previewEndX - 2} ${previewEndY - 10}, ${previewEndX} ${previewEndY}`
          : `M ${a[0]} ${a[1]} C ${a[0]} ${a[1] + 16}, ${b[0]} ${b[1] - 16}, ${b[0]} ${b[1]}`;
      const fullPath = `M ${a[0]} ${a[1]} C ${a[0]} ${a[1] + 16}, ${b[0]} ${b[1] - 16}, ${b[0]} ${b[1]}`;
      return `<path class="${lineClasses}" data-edge="${index}" data-preview-path="${previewPath}" data-full-path="${fullPath}" d="${previewPath}" />`;
    })
    .join("");
  const firstAnswer = nodeAnswersById[item.id]?.[0] || nodeDetailsById[item.id]?.[0] || item.path[0] || item.summary;

  return `
    <article class="tree-card" data-id="${item.id}" tabindex="0" style="--cover-height:${item.height}px; --avatar:${item.color}">
      <div class="tree-cover">
        <div class="tree-map">
          <svg viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">${lines}</svg>
          ${nodes}
        </div>
        <div class="tree-node-content" aria-live="polite">
          <button class="leaf-arrow leaf-arrow-up" type="button" data-nav="parent" aria-label="查看上级节点">⌃</button>
          <button class="leaf-arrow leaf-arrow-right" type="button" data-nav="next" aria-label="查看下一个同级节点">›</button>
          <button class="leaf-arrow leaf-arrow-down" type="button" data-nav="child" aria-label="查看下级节点">⌄</button>
          <button class="leaf-arrow leaf-arrow-left" type="button" data-nav="prev" aria-label="查看上一个同级节点">‹</button>
          <div class="leaf-copy">
            <span class="tree-node-label">${escapeHtml(item.keywords[0])}</span>
            <p>${escapeHtml(firstAnswer)}</p>
          </div>
        </div>
      </div>
      <div class="card-body">
        <div class="title-row">
          <span class="lock" aria-hidden="true">${item.private ? "▢" : "◇"}</span>
          <h3 class="card-title">${escapeHtml(item.title)}</h3>
        </div>
        <p class="card-summary">${escapeHtml(item.summary)}</p>
        <div class="tags">${item.tags.map((tag) => `<span class="tag">${escapeHtml(tag)}</span>`).join("")}</div>
        <div class="meta">
          <span class="author"><span class="avatar">${escapeHtml(item.author.slice(0, 1))}</span>${escapeHtml(item.author)}</span>
          <span class="stats">${item.turns} 轮 · ${item.branches} 枝 · 热度 ${item.heat}</span>
        </div>
      </div>
    </article>
  `;
}

function wireCard(card, item) {
  const nodes = [...card.querySelectorAll(".keyword-node")];
  const lines = [...card.querySelectorAll(".tree-line")];
  const treeCover = card.querySelector(".tree-cover");
  const leaf = card.querySelector(".tree-node-content");
  const leafArrows = [...card.querySelectorAll(".leaf-arrow")];
  const treeNodeLabel = card.querySelector(".tree-node-label");
  const treeNodeText = card.querySelector(".tree-node-content p");
  const parentByNode = new Map(edges.map(([from, to]) => [to, from]));
  let activeNodeIndex = -1;
  let pointerInCover = false;
  let isPreviewing = false;
  let flipTimer = null;
  let flipUpdateTimer = null;

  function getNodeAnswer(index) {
    return nodeAnswersById[item.id]?.[index] || nodeDetailsById[item.id]?.[index] || item.path[index] || item.summary;
  }

  function getNavTargets(index) {
    if (index < 0) return {};
    const parent = parentByNode.has(index) ? parentByNode.get(index) : null;
    const children = edges.filter(([from]) => from === index).map(([, to]) => to);
    const siblings =
      parent === null
        ? []
        : edges
            .filter(([from]) => from === parent)
            .map(([, to]) => to)
            .sort((a, b) => (nodePositions[a]?.[0] || 0) - (nodePositions[b]?.[0] || 0));
    const siblingIndex = siblings.indexOf(index);

    return {
      parent,
      child: children.length ? children[0] : null,
      prev: siblingIndex > 0 ? siblings[siblingIndex - 1] : null,
      next: siblingIndex >= 0 && siblingIndex < siblings.length - 1 ? siblings[siblingIndex + 1] : null,
    };
  }

  function updateLeafArrows(index) {
    const targets = getNavTargets(index);
    leafArrows.forEach((button) => {
      const target = targets[button.dataset.nav];
      button.hidden = target === null || target === undefined;
      button.dataset.target = target ?? "";
    });
  }

  function setLeafOrigin(index) {
    if (!leaf || index < 0) return;
    const [left, top] = nodePositions[index] || nodePositions[0];
    leaf.style.setProperty("--leaf-origin-x", `${left}%`);
    leaf.style.setProperty("--leaf-origin-y", `${top}%`);
  }

  function setActive(index) {
    const activeEdges = new Set();
    let current = index;
    activeNodeIndex = index;

    while (current > 0) {
      const edgeIndex = edges.findIndex(([, to]) => to === current);
      if (edgeIndex < 0) break;
      activeEdges.add(edgeIndex);
      current = edges[edgeIndex][0];
    }

    nodes.forEach((node, nodeIndex) => node.classList.toggle("active", nodeIndex === index));
    lines.forEach((line, lineIndex) => line.classList.toggle("active", activeEdges.has(lineIndex)));
    setLeafOrigin(index);
    updateNodeContent(index);
    updateLeafArrows(index);
    focusNode(index);
  }

  function updateNodeContent(index) {
    if (!treeNodeLabel || !treeNodeText || index < 0) return;
    const keyword = item.keywords[Math.min(index, item.keywords.length - 1)];
    const detail = getNodeAnswer(index);
    treeNodeLabel.textContent = keyword;
    treeNodeText.textContent = detail;
  }

  function flipToNode(index) {
    if (index < 0 || index === activeNodeIndex || !leaf) return;
    window.clearTimeout(flipTimer);
    window.clearTimeout(flipUpdateTimer);
    setLeafOrigin(activeNodeIndex);
    leaf.classList.add("is-flipping");
    flipUpdateTimer = window.setTimeout(() => {
      setActive(index);
      updateDetail(item, index);
    }, 150);
    flipTimer = window.setTimeout(() => {
      leaf.classList.remove("is-flipping");
    }, 430);
  }

  function focusNode(index) {
    if (pointerInCover || index < 0) return;
    const [left, top] = nodePositions[index] || nodePositions[0];
    card.style.setProperty("--tree-pan-x", `${((50 - left) * 0.84).toFixed(2)}%`);
    card.style.setProperty("--tree-pan-y", `${((50 - top) * 1.02).toFixed(2)}%`);
  }

  function getNearestNodeIndex(xPercent, yPercent) {
    return nodePositions.reduce(
      (nearest, [left, top], index) => {
        const distance = (left - xPercent) ** 2 + (top - yPercent) ** 2;
        return distance < nearest.distance ? { index, distance } : nearest;
      },
      { index: 0, distance: Number.POSITIVE_INFINITY },
    ).index;
  }

  function showFullTree() {
    lines.forEach((line) => {
      if (line.dataset.fullPath) line.setAttribute("d", line.dataset.fullPath);
    });
  }

  function resetTree() {
    setActive(-1);
    updateLeafArrows(-1);
    if (leaf) leaf.classList.remove("is-flipping");
    window.clearTimeout(flipTimer);
    window.clearTimeout(flipUpdateTimer);
    lines.forEach((line) => {
      if (line.dataset.previewPath) line.setAttribute("d", line.dataset.previewPath);
    });
    card.style.setProperty("--tree-pan-x", "0%");
    card.style.setProperty("--tree-pan-y", "0%");
  }

  function startPreview() {
    if (previewingCard && previewingCard !== card) {
      previewingCard.dispatchEvent(new CustomEvent("preview:stop"));
    }
    stopPreview();
    isPreviewing = true;
    previewingCard = card;
    card.classList.add("is-previewing");
    let sequenceIndex = 0;
    showFullTree();
    setActive(previewSequence[sequenceIndex]);
    updateDetail(item, previewSequence[sequenceIndex]);

    previewTimer = window.setInterval(() => {
      if (pointerInCover) return;
      sequenceIndex = (sequenceIndex + 1) % previewSequence.length;
      const nodeIndex = previewSequence[sequenceIndex];
      setActive(nodeIndex);
      updateDetail(item, nodeIndex);
    }, 1150);
  }

  function stopCardPreview() {
    isPreviewing = false;
    stopPreview();
    if (previewingCard === card) previewingCard = null;
    card.classList.remove("is-previewing");
    resetTree();
  }

  function showNodeContent(index) {
    stopPreviewDelay();
    stopPreview();
    showFullTree();
    card.classList.remove("is-previewing");
    if (previewingCard === card) previewingCard = null;
    setActive(index);
    if (leaf) {
      leaf.classList.remove("is-growing");
      card.classList.remove("is-lifting");
      void leaf.offsetWidth;
      card.classList.add("is-lifting");
      leaf.classList.add("is-growing");
      window.setTimeout(() => leaf.classList.remove("is-growing"), 760);
      window.setTimeout(() => card.classList.remove("is-lifting"), 760);
    }
    updateDetail(item, index);
  }

  function getRandomNodeIndex() {
    return Math.floor(Math.random() * item.keywords.length);
  }

  nodes.forEach((node, index) => {
    node.addEventListener("click", (event) => {
      event.stopPropagation();
      expandCard(card, () => showNodeContent(index));
    });
  });

  leafArrows.forEach((button) => {
    button.addEventListener("click", (event) => {
      event.stopPropagation();
      const target = Number(button.dataset.target);
      if (!Number.isInteger(target)) return;
      flipToNode(target);
    });
  });

  card.addEventListener("click", () => {
    if (card.classList.contains("is-expanded")) {
      collapseCard(card);
      return;
    }

    expandCard(card, () => showNodeContent(getRandomNodeIndex()));
  });

  card.addEventListener("mouseenter", () => {
    if (isPreviewing) return;
    card.classList.add("is-previewing");
    focusNode(0);
    stopPreviewDelay();
    previewDelayTimer = window.setTimeout(startPreview, 300);
  });

  card.addEventListener("mouseleave", () => {
    stopPreviewDelay();
    pointerInCover = false;
    if (card.classList.contains("is-expanded")) {
      focusNode(activeNodeIndex);
      return;
    }
    stopCardPreview();
  });

  card.addEventListener("keydown", (event) => {
    if (card.classList.contains("is-expanded")) {
      const keyMap = {
        ArrowUp: "parent",
        ArrowRight: "next",
        ArrowDown: "child",
        ArrowLeft: "prev",
      };
      const nav = keyMap[event.key];
      if (nav) {
        const target = getNavTargets(activeNodeIndex)[nav];
        if (target !== null && target !== undefined) {
          event.preventDefault();
          flipToNode(target);
        }
        return;
      }
    }

    if (event.key !== "Enter" && event.key !== " ") return;
    event.preventDefault();
    card.click();
  });

  treeCover.addEventListener("mouseenter", () => {
    if (!card.classList.contains("is-expanded")) return;
    pointerInCover = true;
  });

  treeCover.addEventListener("mousemove", (event) => {
    if (!card.classList.contains("is-expanded")) return;
    pointerInCover = true;
    const rect = treeCover.getBoundingClientRect();
    const x = (event.clientX - rect.left) / rect.width - 0.5;
    const y = (event.clientY - rect.top) / rect.height - 0.5;
    card.style.setProperty("--tree-pan-x", `${(-x * 52).toFixed(2)}%`);
    card.style.setProperty("--tree-pan-y", `${(-y * 86).toFixed(2)}%`);
  });

  treeCover.addEventListener("mouseleave", () => {
    pointerInCover = false;
    focusNode(activeNodeIndex);
  });

  card.addEventListener("preview:reset", resetTree);
  card.addEventListener("preview:stop", stopCardPreview);
}

function stopPreview() {
  if (!previewTimer) return;
  window.clearInterval(previewTimer);
  previewTimer = null;
}

function stopPreviewDelay() {
  if (!previewDelayTimer) return;
  window.clearTimeout(previewDelayTimer);
  previewDelayTimer = null;
}

function expandCard(card, startPreview) {
  stopPreviewDelay();
  if (expandedCard && expandedCard !== card) {
    expandedCard.classList.remove("is-expanded");
    expandedCard.dispatchEvent(new CustomEvent("preview:stop"));
  }

  expandedCard = card;
  card.classList.add("is-expanded");
  startPreview();
}

function collapseCard(card) {
  card.classList.remove("is-expanded");
  if (expandedCard === card) expandedCard = null;
}

function updateDetail(item, activeIndex = 0) {
  if (!detailTitle) return;
  detailTitle.textContent = item.title;
  detailSummary.textContent = item.summary;
  detailTurns.textContent = item.turns;
  detailBranches.textContent = item.branches;
  detailHeat.textContent = item.heat;
  detailPath.innerHTML = item.path
    .map((step, index) => {
      const keyword = item.keywords[Math.min(index + activeIndex, item.keywords.length - 1)];
      return `<div class="path-item"><strong>${escapeHtml(keyword)}</strong>${escapeHtml(step)}</div>`;
    })
    .join("");
}

searchInput.addEventListener("input", renderFeed);
sortSelect.addEventListener("change", renderFeed);

renderFeed();

</script>
