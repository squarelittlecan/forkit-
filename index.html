<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ForkitChat Frontend Demo</title>
    <meta
      name="description"
      content="A static GitHub Pages ready prototype for ForkitChat's keyword tree discovery feed."
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar" aria-label="主导航">
        <a class="brand" href="#" aria-label="Forkit 首页">
          <span class="brand-mark">F</span>
          <span>Forkit</span>
        </a>
        <nav class="side-nav">
          <a class="side-link active" href="#"><span aria-hidden="true">⌂</span>发现</a>
          <a class="side-link" href="#"><span aria-hidden="true">◎</span>正在讨论</a>
          <a class="side-link" href="#"><span aria-hidden="true">＋</span>开始一棵树</a>
          <a class="side-link" href="#"><span aria-hidden="true">◌</span>我的树</a>
        </nav>
        <button class="login-button">登录</button>
        <div class="sidebar-foot">
          <button class="plain-button">更多</button>
          <button class="plain-button">关于 Forkit</button>
        </div>
      </aside>

      <main class="main">
        <header class="topbar">
          <div class="search-wrap">
            <span aria-hidden="true">⌕</span>
            <input id="searchInput" type="search" placeholder="搜索问题、关键词或作者" />
          </div>
          <div class="top-actions">
            <button class="ghost-button">创作中心</button>
            <button class="primary-button">Start a tree</button>
          </div>
        </header>

        <section class="content-layout">
          <div>
            <div class="feed-head">
              <div>
                <h2>社区问题树</h2>
              </div>
              <select id="sortSelect" aria-label="排序方式">
                <option value="hot">Hot branches</option>
                <option value="new">Latest</option>
                <option value="deep">Deepest</option>
              </select>
            </div>
            <div id="feed" class="masonry-feed" aria-live="polite"></div>
          </div>

          <aside class="detail-panel" aria-label="聊天详情">
            <div class="panel-sticky">
              <p class="eyebrow">Selected tree</p>
              <h2 id="detailTitle">划过或点击一张卡片</h2>
              <p id="detailSummary">
                右侧会显示这棵树的摘要、主干问题和可继续展开的分支。
              </p>
              <div class="metric-row">
                <div><strong id="detailTurns">0</strong><span>轮对话</span></div>
                <div><strong id="detailBranches">0</strong><span>分支</span></div>
                <div><strong id="detailHeat">0</strong><span>热度</span></div>
              </div>
              <div id="detailPath" class="path-list"></div>
            </div>
          </aside>
        </section>
      </main>
    </div>

    <script src="./app.js"></script>
  </body>
</html>
